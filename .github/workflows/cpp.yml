# To debug a workflow see: https://docs.github.com/en/actions/configuring-and-managing-workflows/managing-a-workflow-run#enabling-debug-logging

name: C++ CI

on:
  push:
  schedule:
    - cron: '0 2 * * SAT'
  workflow_dispatch:

jobs:
  build-cpp-unix:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC (distro default)
            os: ubuntu-26.04
            c-compiler: gcc
            cxx-compiler: g++
          - name: Linux Clang (distro default)
            os: ubuntu-26.04
            c-compiler: clang
            cxx-compiler: clang++
          - name: macOS (AppleClang)
            os: macos-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: install GCC
        run: sudo apt-get install -qy gcc g++
        if: matrix.c-compiler == 'gcc' && runner.os == 'Linux'
      - name: install Clang (with libc++, required by CMakeLists.txt)
        run: sudo apt-get install -qy clang libc++-dev libc++abi-dev
        if: matrix.c-compiler == 'clang' && runner.os == 'Linux'
      - name: install additional tools and libs
        run: |
          if [ "${{runner.os}}" == "Linux" ]; then
            # libunwind-dev sometimes required to work around cxx_feature_check(STD_REGEX) for Google Benchmark 
            sudo apt-get install -y libtbb-dev ninja-build libunwind-dev
          fi
          if [ "${{runner.os}}" == "macOS" ]; then
            brew install ninja
          fi        
      - name: configure
        run: |
          echo "Configure on $(uname -a)"
          cd cpp && mkdir build && cd build && CC=${{matrix.c-compiler}} CXX=${{matrix.cxx-compiler}} cmake .. -G Ninja 
      - name: build
        run: cd cpp && cmake --build build
      - name: test
        run: cd cpp/build && ctest

  build-cpp-windows:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ windows-latest ]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: configure
        run: cd cpp && mkdir build && cd build && cmake ..
      - name: build
        run: cd cpp && cmake --build build --config Debug
      - name: test
        run: cd cpp/build && ctest -C Debug
