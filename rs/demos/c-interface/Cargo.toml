[package]
name = "c-interface"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
cc = "1"
bindgen = { version = "0.73", optional = true }

[features]
# Regenerates the same bindings via bindgen and compares them against the
# hand-written ones in src/ffi/manual.rs. Requires libclang locally.
bindgen-compare = ["dep:bindgen"]
